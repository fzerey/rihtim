appId: com.rihtim.desktop
productName: Rihtim
copyright: Copyright © 2026 Rihtim

# electronVersion is not set here: scripts/build-desktop.mjs passes the installed
# electron version (--config.electronVersion), so packaged apps always ship the
# Electron the app is developed and tested against.

# The bundled servers run as separate Node processes, so no native modules need
# rebuilding against Electron. Skipping this also avoids electron-builder running
# a package install that chokes on pnpm `workspace:*` deps.
npmRebuild: false

directories:
  output: release
  buildResources: buildResources

# Clean, scope-free installer file names (avoids the "@rihtim/..." path).
artifactName: ${productName}-${version}-${arch}.${ext}

# Only the compiled Electron shell lives inside the asar archive.
files:
  - dist/**/*
  - package.json

# The bundled API and Next.js servers are shipped unpacked so their Node
# processes (and native modules) can be spawned at runtime.
#
# Copy the parent `resources` folder, not `resources/server` and `resources/web`
# separately: electron-builder always skips a node_modules folder sitting directly
# in an extraResources `from` dir (whatever the filter), which left both servers
# without their dependencies. One level deeper they are copied.
extraResources:
  - from: resources
    to: .
    filter:
      - "server/**/*"
      - "web/**/*"

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  # Without this the binary is named after the scoped package ("@rihtim/desktop"),
  # which electron-builder 26 rejects.
  executableName: rihtim
  category: Development
  maintainer: Rihtim
  target:
    - AppImage
    - deb
