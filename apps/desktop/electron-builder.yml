appId: com.rihtim.desktop
productName: Rihtim
copyright: Copyright © 2026 Rihtim

# Pinned so electron-builder doesn't need to resolve the electron module from
# node_modules (it isn't in apps/desktop/node_modules under a hoisted layout).
electronVersion: 31.7.7

# The bundled servers run as separate Node processes, so no native modules need
# rebuilding against Electron. Skipping this also avoids electron-builder running
# a package install that chokes on pnpm `workspace:*` deps.
npmRebuild: false

directories:
  output: release
  buildResources: buildResources

# Clean, scope-free installer file names (avoids the "@rihtim/..." path).
artifactName: ${productName}-${version}-${arch}.${ext}

# Only the compiled Electron shell lives inside the asar archive.
files:
  - dist/**/*
  - package.json

# The bundled API and Next.js servers are shipped unpacked so their Node
# processes (and native modules) can be spawned at runtime.
extraResources:
  - from: resources/server
    to: server
  - from: resources/web
    to: web

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  category: Development
  maintainer: Rihtim
  target:
    - AppImage
    - deb
