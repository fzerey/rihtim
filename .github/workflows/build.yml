name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\rihtim-windows-x64 | Out-Null
          pnpm --filter @rihtim/api deploy --prod release\rihtim-windows-x64\api
          pnpm --filter @rihtim/web deploy --prod release\rihtim-windows-x64\web

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          start /min "Rihtim API" cmd /c "cd api && node dist/server.js"
          timeout /t 2 /nobreak >nul
          start "Rihtim Web" cmd /k "cd web && node node_modules/next/dist/bin/next start -p 3030"
          echo Rihtim baslatildi:
          echo API: http://127.0.0.1:5170
          echo Web: http://localhost:3030
          '@ | Set-Content -Path release\rihtim-windows-x64\start.bat -Encoding ascii

          @'
          # Rihtim Release Paketi

          ## Calistirma (Windows)
          `start.bat` dosyasini calistirin.

          ## Notlar
          - Docker Engine calisir durumda olmalidir.
          - Varsayilan API adresi: http://127.0.0.1:5170
          - Varsayilan Web adresi: http://localhost:3030
          '@ | Set-Content -Path release\rihtim-windows-x64\README.md -Encoding utf8

      - name: Archive package
        shell: pwsh
        run: Compress-Archive -Path release\rihtim-windows-x64\* -DestinationPath release\rihtim-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rihtim-windows-x64
          path: release/rihtim-windows-x64.zip

  build-linux:
    name: Build Linux package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Prepare package
        run: |
          mkdir -p release/rihtim-linux-x64
          pnpm --filter @rihtim/api deploy --prod release/rihtim-linux-x64/api
          pnpm --filter @rihtim/web deploy --prod release/rihtim-linux-x64/web

          cat > release/rihtim-linux-x64/start.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"

          (
            cd api
            node dist/server.js
          ) &
          API_PID=$!
          trap 'kill $API_PID' EXIT

          sleep 2
          cd web
          node node_modules/next/dist/bin/next start -p 3030
          EOF

          chmod +x release/rihtim-linux-x64/start.sh

          cat > release/rihtim-linux-x64/README.md << 'EOF'
          # Rihtim Release Paketi

          ## Calistirma (Linux)
          chmod +x start.sh
          ./start.sh

          ## Notlar
          - Docker Engine calisir durumda olmalidir.
          - Varsayilan API adresi: http://127.0.0.1:5170
          - Varsayilan Web adresi: http://localhost:3030
          EOF

      - name: Archive package
        run: tar -C release -czf release/rihtim-linux-x64.tar.gz rihtim-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rihtim-linux-x64
          path: release/rihtim-linux-x64.tar.gz

  build-macos:
    name: Build macOS package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Prepare package
        run: |
          mkdir -p release/rihtim-macos-x64
          pnpm --filter @rihtim/api deploy --prod release/rihtim-macos-x64/api
          pnpm --filter @rihtim/web deploy --prod release/rihtim-macos-x64/web

          cat > release/rihtim-macos-x64/start.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"

          (
            cd api
            node dist/server.js
          ) &
          API_PID=$!
          trap 'kill $API_PID' EXIT

          sleep 2
          cd web
          node node_modules/next/dist/bin/next start -p 3030
          EOF

          chmod +x release/rihtim-macos-x64/start.sh

          cat > release/rihtim-macos-x64/README.md << 'EOF'
          # Rihtim Release Paketi

          ## Calistirma (macOS)
          chmod +x start.sh
          ./start.sh

          ## Notlar
          - Docker Engine calisir durumda olmalidir.
          - Varsayilan API adresi: http://127.0.0.1:5170
          - Varsayilan Web adresi: http://localhost:3030
          EOF

      - name: Archive package
        run: tar -C release -czf release/rihtim-macos-x64.tar.gz rihtim-macos-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rihtim-macos-x64
          path: release/rihtim-macos-x64.tar.gz

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/rihtim-windows-x64/rihtim-windows-x64.zip
            release-assets/rihtim-linux-x64/rihtim-linux-x64.tar.gz
            release-assets/rihtim-macos-x64/rihtim-macos-x64.tar.gz
