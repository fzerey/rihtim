name: Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            runner: windows-latest
            artifact-name: rihtim-windows-x64

          # Ubuntu/Linux
          - os: ubuntu
            runner: ubuntu-latest
            artifact-name: rihtim-linux-x64

          # macOS
          - os: macos
            runner: macos-latest
            artifact-name: rihtim-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Create standalone bundle
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.os }}/rihtim

          # API'yi kopyala
          cp -r apps/api/dist dist/${{ matrix.os }}/rihtim/api
          cp apps/api/package.json dist/${{ matrix.os }}/rihtim/api/

          # Web'i kopyala (standalone mode)
          cp -r apps/web/.next/standalone/* dist/${{ matrix.os }}/rihtim/web/
          cp -r apps/web/public dist/${{ matrix.os }}/rihtim/web/ || true

