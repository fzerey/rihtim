name: Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            runner: windows-latest
            build-cmd: pnpm build
            artifact-name: rihtim-windows-x64
            exe-cmd: npx pkg --compress Brotli --targets node22-win-x64 apps/api/dist/server.js -o dist/windows/rihtim-api.exe && npx pkg --compress Brotli --targets node22-win-x64 apps/web/.next/standalone/server.js -o dist/windows/rihtim-web.exe

          # Ubuntu/Linux
          - os: ubuntu
            runner: ubuntu-latest
            build-cmd: pnpm build
            artifact-name: rihtim-linux-x64
            exe-cmd: npx pkg --compress Brotli --targets node22-linux-x64 apps/api/dist/server.js -o dist/linux/rihtim-api && npx pkg --compress Brotli --targets node22-linux-x64 apps/web/.next/standalone/server.js -o dist/linux/rihtim-web && chmod +x dist/linux/rihtim-*

          # macOS
          - os: macos
            runner: macos-latest
            build-cmd: pnpm build
            artifact-name: rihtim-macos-x64
            exe-cmd: npx pkg --compress Brotli --targets node22-macos-x64 apps/api/dist/server.js -o dist/macos/rihtim-api && npx pkg --compress Brotli --targets node22-macos-x64 apps/web/.next/standalone/server.js -o dist/macos/rihtim-web && chmod +x dist/macos/rihtim-*

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: ${{ matrix.build-cmd }}

      - name: Create standalone executables
        shell: bash
        run: |
          npm install -g pkg
          mkdir -p dist/${{ matrix.os }}
          ${{ matrix.exe-cmd }}

      - name: Package executables
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            cd dist/windows
            7z a rihtim-${{ github.ref_name }}-windows-x64.zip rihtim-*.exe
          else
            cd dist/${{ matrix.os }}
            tar -czf rihtim-${{ github.ref_name }}-${{ matrix.os }}-x64.tar.gz rihtim-*
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.os }}/rihtim-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          token: ${{ secrets.GITHUB_TOKEN }}
