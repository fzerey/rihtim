name: Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            runner: windows-latest
            build-cmd: pnpm build
            artifact-name: rihtim-windows-x64
            package-cmd: mkdir -p dist/windows && 7z a dist/windows/rihtim-${{ github.ref_name }}-windows-x64.zip apps/api/dist apps/web/.next package.json pnpm-workspace.yaml

          # Ubuntu/Linux
          - os: ubuntu
            runner: ubuntu-latest
            build-cmd: pnpm build
            artifact-name: rihtim-linux-x64
            package-cmd: mkdir -p dist/linux && tar -czf dist/linux/rihtim-${{ github.ref_name }}-linux-x64.tar.gz apps/api/dist apps/web/.next package.json pnpm-workspace.yaml

          # macOS
          - os: macos
            runner: macos-latest
            build-cmd: pnpm build
            artifact-name: rihtim-macos-x64
            package-cmd: mkdir -p dist/macos && tar -czf dist/macos/rihtim-${{ github.ref_name }}-macos-x64.tar.gz apps/api/dist apps/web/.next package.json pnpm-workspace.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: ${{ matrix.build-cmd }}

      - name: Create packages
        shell: bash
        run: ${{ matrix.package-cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.os }}/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          token: ${{ secrets.GITHUB_TOKEN }}
