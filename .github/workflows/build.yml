name: Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            runner: windows-latest
            artifact-name: rihtim-windows-x64

          # Ubuntu/Linux
          - os: ubuntu
            runner: ubuntu-latest
            artifact-name: rihtim-linux-x64

          # macOS
          - os: macos
            runner: macos-latest
            artifact-name: rihtim-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Install ncc
        run: npm install -g @vercel/ncc

      - name: Create executables (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          mkdir -p dist/windows/rihtim
          
          # Compile API to single file
          ncc build apps/api/dist/server.js -o dist/windows/rihtim/api-dist -m
          
          # Compile Web to single file
          ncc build apps/web/.next/standalone/server.js -o dist/windows/rihtim/web-dist -m
          
          # Create API wrapper
          $apiWrapper = @"
          const path = require('path');
          process.env.NODE_ENV = 'production';
          require('./api-dist/index.js');
          "@
          
          Set-Content -Path "dist/windows/rihtim/api-wrapper.js" -Value $apiWrapper
          
          # Create Web wrapper  
          $webWrapper = @"
          const path = require('path');
          process.env.NODE_ENV = 'production';
          process.env.PORT = '3030';
          require('./web-dist/index.js');
          "@
          
          Set-Content -Path "dist/windows/rihtim/web-wrapper.js" -Value $webWrapper

      - name: Create executables (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.os }}/rihtim
          
          # Compile API to single file
          ncc build apps/api/dist/server.js -o dist/${{ matrix.os }}/rihtim/api-dist -m
          
          # Compile Web to single file
          ncc build apps/web/.next/standalone/server.js -o dist/${{ matrix.os }}/rihtim/web-dist -m
          
          # Create API wrapper
          cat > dist/${{ matrix.os }}/rihtim/api-wrapper.js << 'EOF'
          const path = require('path');
          process.env.NODE_ENV = 'production';
          require('./api-dist/index.js');
          EOF
          
          # Create Web wrapper
          cat > dist/${{ matrix.os }}/rihtim/web-wrapper.js << 'EOF'
          const path = require('path');
          process.env.NODE_ENV = 'production';
          process.env.PORT = '3030';
          require('./web-dist/index.js');
          EOF

      - name: Create Windows start script
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $batContent = @"
          @echo off
          cd /d "%~dp0"
          
          echo Starting Rihtim...
          echo.
          
          start /min "Rihtim API" node api-wrapper.js
          timeout /t 2 /nobreak
          start "Rihtim Web" cmd /k "node web-wrapper.js"
          
          echo.
          echo API: http://127.0.0.1:5170
          echo Web UI: http://localhost:3030
          "@
          
          Set-Content -Path "dist/${{ matrix.os }}/rihtim/start.bat" -Value $batContent -Encoding ASCII

      - name: Create Linux/macOS start script
        if: matrix.os != 'windows'
        shell: bash
        run: |
          cat > dist/${{ matrix.os }}/rihtim/start.sh << 'SCRIPT'
          #!/bin/bash
          cd "$(dirname "$0")"
          
          echo "Starting Rihtim..."
          node api-wrapper.js &
          API_PID=$!
          sleep 2
          
          echo ""
          echo "API: http://127.0.0.1:5170"
          echo "Web UI: http://localhost:3030"
          echo ""
          
          node web-wrapper.js
          trap "kill $API_PID" EXIT
          SCRIPT
          
          chmod +x dist/${{ matrix.os }}/rihtim/start.sh

      - name: Create README
        shell: bash
        run: |
          cat > dist/${{ matrix.os }}/rihtim/README.md << 'README'
          # Rihtim - Docker Management UI
          
          A web-based Docker management interface with native WSL2 support.
          
          ## Quick Start
          
          ### Windows
          Double-click `start.bat`
          
          ### Linux / macOS
          ```bash
          chmod +x start.sh
          ./start.sh
          ```
          
          Open http://localhost:3030
          
          ## Requirements
          - Docker Engine running
          - Node.js 20+ (included in executables)
          
          ## Features
          - Container management
          - Image management & Docker Hub search
          - Volume management with size reporting
          - Network management
          - Real-time logs
          - Multi-context support (Docker Desktop, WSL, SSH, TCP)
          - Turkish & English support
          
          ## License
          MIT
          README

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p dist/windows/packages
          cd dist/windows/rihtim
          7z a ../packages/rihtim-](#)

