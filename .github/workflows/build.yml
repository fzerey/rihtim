name: Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            runner: windows-latest
            artifact-name: rihtim-windows-x64

          # Ubuntu/Linux
          - os: ubuntu
            runner: ubuntu-latest
            artifact-name: rihtim-linux-x64

          # macOS
          - os: macos
            runner: macos-latest
            artifact-name: rihtim-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Create standalone bundle
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.os }}/rihtim
          cp -r apps/api/dist dist/${{ matrix.os }}/rihtim/api
          cp apps/api/package.json dist/${{ matrix.os }}/rihtim/api/
          cp -r apps/web/.next/standalone/* dist/${{ matrix.os }}/rihtim/web/ 2>/dev/null || true
          cp -r apps/web/public dist/${{ matrix.os }}/rihtim/web/ 2>/dev/null || true
          mkdir -p dist/${{ matrix.os }}/rihtim/node_modules
          cp -r node_modules/* dist/${{ matrix.os }}/rihtim/node_modules/ 2>/dev/null || true

      - name: Create Windows start script
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $batContent = @"
          @echo off
          setlocal enabledelayedexpansion
          
          cd /d "%~dp0"
          
          echo Starting Rihtim...
          echo.
          
          REM Start API in background
          start /min "Rihtim API" node api\dist\server.js
          
          REM Wait a moment for API to start
          timeout /t 2 /nobreak
          
          REM Start Web UI
          start "Rihtim Web" cmd /k "cd web && node server.js"
          
          echo.
          echo API running on: http://127.0.0.1:5170
          echo Web UI: http://localhost:3030
          "@
          
          Set-Content -Path "dist/${{ matrix.os }}/rihtim/start.bat" -Value $batContent -Encoding ASCII

      - name: Create Linux/macOS start script
        if: matrix.os != 'windows'
        shell: bash
        run: |
          cat > dist/${{ matrix.os }}/rihtim/start.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          cd "$(dirname "$0")"
          
          echo "Starting Rihtim..."
          echo ""
          
          # Start API in background
          node api/dist/server.js &
          API_PID=$!
          
          # Wait for API to be ready
          sleep 2
          
          # Start Web UI (foreground)
          echo ""
          echo "API running on: http://127.0.0.1:5170"
          echo "Web UI: http://localhost:3030"
          echo ""
          
          cd web && node server.js
          
          # Clean up on exit
          trap "kill $API_PID" EXIT
          SCRIPT
          
          chmod +x dist/${{ matrix.os }}/rihtim/start.sh

      - name: Create README
        shell: bash
        run: |
          cat > dist/${{ matrix.os }}/rihtim/README.md << 'README'
          # Rihtim - Docker Management UI
          
          A web-based Docker management interface with native WSL2 support.
          
          ## Quick Start
          
          ### Windows
          Double-click `start.bat` to launch:
          - API Server (background)
          - Web UI (http://localhost:3030)
          
          ### Linux / macOS
          ```bash
          chmod +x start.sh
          ./start.sh
          ```
          
          Then open http://localhost:3030 in your browser.
          
          ## URLs
          
          - **Web UI**: http://localhost:3030
          - **API**: http://127.0.0.1:5170
          
          ## Requirements
          
          - Docker Engine running
          - Node.js 20+ (included in bundle)
          
          ## Features
          
          - Container management (start, stop, restart, remove)
          - Image management & Docker Hub search
          - Volume management with size reporting
          - Network management
          - Real-time logs via WebSocket
          - Multi-context support (Docker Desktop, WSL, SSH, TCP)
          - Turkish & English support
          - Performance optimized
          
          ## Troubleshooting
          
          **Port already in use?**
          - API runs on port 5170
          - Web UI runs on port 3030
          
          **Docker not found?**
          - Ensure Docker Engine is running
          - Check Docker socket/pipe permissions
          
          **For WSL support:**
          - Ensure Docker is running in your WSL distro
          - Add WSL context from Settings in the UI
          
          ## License
          
          MIT
          README

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.os }}/packages
          if [ "${{ matrix.os }}" = "windows" ]; then
            cd dist/${{ matrix.os }}
            7z a packages/rihtim-${{ github.ref_name }}-windows-x64.zip rihtim/
          else
            cd dist/${{ matrix.os }}
            tar -czf packages/rihtim-${{ github.ref_name }}-${{ matrix.os }}-x64.tar.gz rihtim/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.os }}/packages/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          token: ${{ secrets.GITHUB_TOKEN }}
