version: 2
updates:
  # One entry at the repo root covers every pnpm workspace package (apps/*, packages/*, e2e)
  # and keeps the single root pnpm-lock.yaml in sync. Per-app entries create PRs without a
  # lockfile update, which breaks `pnpm install --frozen-lockfile`.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Every update rewrites pnpm-lock.yaml, so separate PRs conflict with each other.
    # Group minor and patch updates into one PR; majors still come one by one.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
